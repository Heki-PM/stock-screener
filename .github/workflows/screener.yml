name: Stock Screener SMI

on:

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-screener
  cancel-in-progress: false

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      # CACHE: fundamenty i daty wyników (.cache/) przechodzą między przebiegami. Runner startuje "na zimno",
      # więc bez tego kroku cache 24h w screener.py nie działa. restore-keys bierze NAJNOWSZY zapis z gałęzi.
      - name: Przywróć cache Yahoo (fundamenty, daty wyników)
        id: yf-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: yf-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            yf-cache-

      - name: Run screener
        run: |
          python scripts/screener.py
        env:
          PYTHONUNBUFFERED: "1"
          WP_API_TOKEN: ${{ secrets.WP_API_TOKEN }}
          # SEC EDGAR (fundamenty USA): "Nazwa e-mail" – bez e-maila SEC zwraca 403 i screener bierze dane z Yahoo
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

      # always(): częściowy postęp (pobrane już rekordy) zostaje także, gdy późniejszy krok się wywali.
      # Unikalny klucz na każdy przebieg; GitHub sam usuwa najstarsze wpisy (limit 10 GB, 7 dni bez użycia).
      - name: Zapisz cache Yahoo
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: yf-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save dated copy of results
        run: |
          DATE=$(date -u +'%Y-%m-%d')

          cp results/results_main.json \
             results/results_main_${DATE}.json

          echo "✅ Saved results_main_${DATE}.json"

          # Lista Early D1 (nowa w screener.py): kopia datowana, żeby n8n/generator miał stały adres pliku.
          # Bez czyszczenia po wieku: na runnerze po checkout wszystkie pliki mają świeży mtime
          # (jak w results_main_*, gdzie `-mtime +30` nic nie usuwa), a plik waży ~35 KB/dzień.
          if [ -f results/results_early.json ]; then
            cp results/results_early.json results/results_early_${DATE}.json
            echo "✅ Saved results_early_${DATE}.json"
          fi

          find results/ \
            -name 'results_main_*.json' \
            ! -name "results_main_${DATE}.json" \
            -mtime +30 \
            -delete || true

      - name: Verify output
        run: |
          DATE=$(date -u +'%Y-%m-%d')

          echo "🔎 Checking screener output..."

          REQUIRED_FILES="
          results/index.html
          results/screener.html
          results/index_all.html
          results/results.json
          results/results_main.json
          results/results_main_${DATE}.json
          "

          for f in $REQUIRED_FILES; do
            if [ ! -f "$f" ]; then
              echo "❌ BŁĄD: brak pliku $f"
              exit 1
            fi
          done

          echo "✅ Wszystkie wymagane pliki istnieją."

          python3 <<'PY'
          import json
          import sys

          files = [
              "results/results.json",
              "results/results_main.json"
          ]

          for filename in files:
              try:
                  with open(filename, "r", encoding="utf-8") as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"❌ BŁĄD JSON: {filename}: {e}")
                  sys.exit(1)

              if not isinstance(data, (list, dict)):
                  print(f"❌ BŁĄD: {filename} ma nieprawidłowy format")
                  sys.exit(1)

              count = len(data)

              if count == 0:
                  print(f"❌ BŁĄD: {filename} jest pusty")
                  sys.exit(1)

              print(f"✅ {filename}: {count} rekordów")

          full = json.load(open("results/results.json", encoding="utf-8"))
          main = json.load(open("results/results_main.json", encoding="utf-8"))

          print("----------------------------------------")
          print(f"Full Scan:       {len(full)}")
          print(f"Screener główny: {len(main)}")
          print("----------------------------------------")
          PY

      # Kontrola jakości: gdy Yahoo odmawia (401) przy dużej współbieżności, rekordy bez sektora/EPS
      # przechodzą przez filter_main ("brak danych = przepuszczamy"). Tylko ostrzeżenie, bez przerywania.
      - name: Kontrola kompletności danych (ostrzeżenie)
        run: |
          python3 <<'PY'
          import json, os
          main = json.load(open("results/results_main.json", encoding="utf-8"))
          n = len(main)
          no_sector = sum(1 for r in main if r.get("sector") in (None, "--"))
          no_eps    = sum(1 for r in main if r.get("eps_ttm") is None)
          no_roic   = sum(1 for r in main if r.get("roic") is None)
          incompl   = sum(1 for r in main if r.get("data_incomplete"))
          lines = [
              "### Kompletność danych – screener główny",
              "| Metryka | Liczba | % listy |", "|---|---|---|",
          ]
          for label, v in (("brak sektora", no_sector), ("brak EPS", no_eps),
                           ("brak ROIC", no_roic), ("data_incomplete po retry", incompl)):
              lines.append(f"| {label} | {v} | {round(100*v/n) if n else 0}% |")
          summary = "\n".join(lines)
          print(summary)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write(summary + "\n")
          if n and no_sector / n > 0.3:
              print(f"::warning::{no_sector}/{n} pozycji listy głównej bez sektora/nazwy (Yahoo 401?) - filtry fundamentalne mogły być pominięte")
          PY

      - name: Generate Claude prompt file
        run: |
          if [ -f scripts/make_prompt.py ]; then
            python scripts/make_prompt.py
            echo "✅ Claude prompt generated"
          else
            echo "ℹ️ make_prompt.py not found - skipping"
          fi

      - name: Commit wyników do repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add results/

          if git diff --staged --quiet; then
            echo "ℹ️ Brak zmian do commitowania"
          else
            git commit \
              -m "📊 SMI scan $(date -u +'%Y-%m-%d %H:%M UTC')"

            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: results/

  # Osobny job: między jobami mija kilkanaście sekund, więc artefakt
  # "github-pages" zdąży być widoczny w API (unika race condition z 2026-11-17).
  deploy:
    needs: run-screener
    # Tylko z main: test z gałęzi (workflow_dispatch) nie może podmieniać strony GitHub Pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # n8n czyta dane z katalogu results/ w repo (commit w run-screener),
  # więc webhook leci od razu po screenerze, równolegle z deployem Pages
  # i niezależnie od jego wyniku.
  notify-n8n:
    needs: run-screener
    # Tylko z main: przebieg testowy z gałęzi nie może wołać webhooka n8n (publikacja na stronie).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Powiadom n8n o nowych wynikach (webhook)
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          # Retry tylko przy problemach z połączeniem / 5xx (bez --max-time,
          # żeby wolna odpowiedź n8n nie powodowała podwójnego wywołania).
          curl -sf --retry 3 --retry-delay 20 --retry-connrefused --connect-timeout 20 \
            -X POST "https://eve320-20320.mikrus.cloud/webhook/zhelektro-daily-refresh" \
            -H "X-Webhook-Secret: ${{ secrets.N8N_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"date\": \"${DATE}\"}"

     
